<!DOCTYPE html>

<head>

<title>Pré-consultation – Activité Physique</title>

<style>
body {
  font-family: Arial, sans-serif;

.container {

  min-height:100vh;
}

h1,h2,h3 {

}

/* =========================
   OPTION A — MICRO UX VISUELLE
   ========================= */

/* Question principale */
p {
  margin-top:12px;
  margin-bottom:10px;
  line-height:1.5;
}

/* Première phrase = question → plus visible */
p:first-of-type {
  font-weight:600;
}

/* Paragraphes explicatifs → plus discrets */
p + p {
  font-weight:400;
  color:#555;
}

/* Espacement clair avant les boutons */
.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 14px 0 6px 0;   /* boutons bleus plus rapprochés */
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background: #007BFF;
  color: white;
  cursor: pointer;
}

.btn.secondary {
  background: #6c757d;
  margin-top: 18px;      /* séparation claire avant le bouton Retour */
}

.btn:disabled {
  background:#b0b0b0;
  cursor:not-allowed;
}

/* ========================= */

.section {
  border-top:1px solid #ddd;
  padding-top:15px;
  margin-top:20px;
}

.progress {
  height:6px;
  background:#ddd;
  margin:15px 0;
}

.progress-bar {
  height:6px;
  background:#4caf50;
}
.progress-step {
  font-size:12px;
  color:#777;
  margin-bottom:10px;
}
.footer {
  font-size:12px;
  color:#666;
  margin-top:40px;
}

.answer {
  margin-left:10px;
  margin-top:4px;
}

.rgpd {
  font-size:12px;
  color:#555;
  margin-top:8px;
}

input[type=number],
input[type=range],
textarea {
  width:100%;
  padding:10px;
  font-size:16px;
}

textarea {
  min-height:80px;
}

.time-row {
  display:flex;
  gap:10px;
}

.guard {
  font-size:13px;
  color:#d97706;
  margin-top:6px;
}

.back-info {
  font-size:12px;
  color:#666;
  margin-top:6px;
  text-align:center;
}

</style>
</head>

<body>
<div class="container" id="app"></div>

<script>

/*************************************************
 * ÉTAT GLOBAL
 *************************************************/
const state = {
  tool: null,
  gpaq: {},
  marshall: {},
  result: {},
  history: [], 
  progress: {
  current: 0,
  total: 0
}
};

/*************************************************
 * RENDER + RETOUR
 *************************************************/
function render(html, progress=0, save=true){
  if(save) state.history.push(document.getElementById("app").innerHTML);
  document.getElementById("app").innerHTML = `
    <div class="progress">
  <div class="progress-bar" style="width:${
    state.progress.total > 0
  ? Math.round((state.progress.current / state.progress.total) * 100)
  : 0

  }%"></div>
</div>
<div class="progress-step">
  Étape ${state.progress.current} / ${state.progress.total}
</div>
    ${html}
  `;
}
function back(){
  if(state.history.length>0){
    document.getElementById("app").innerHTML = state.history.pop();
  }
}

/*************************************************
 * UX — UTILITAIRES (NON CLINIQUES)
 *************************************************/
function checkRequiredDuration(btnId, daySel, hSel, mSel){
  const btn = document.getElementById(btnId);
  if(!btn) return;

  const d = document.querySelector(daySel)?.value;
  const h = document.querySelector(hSel)?.value;
  const m = document.querySelector(mSel)?.value;

  const hasDay = d !== "";
  const hasTime = (h !== "" && Number(h) > 0) || (m !== "" && Number(m) > 0);

  btn.disabled = !(hasDay && hasTime);
}

function checkRequiredTimeOnly(btnId, hSel, mSel){
  const btn = document.getElementById(btnId);
  if(!btn) return;

  const h = document.querySelector(hSel)?.value;
  const m = document.querySelector(mSel)?.value;

  btn.disabled = (h === "" && m === "");
}
function checkDurationGuard(hSel, mSel, guardId){
  const h = Number(document.querySelector(hSel)?.value || 0);
  const m = Number(document.querySelector(mSel)?.value || 0);
  const guard = document.getElementById(guardId);
  if(!guard) return;
  guard.style.display = (h + m/60) > 12 ? "block" : "none";
}
function advanceProgress(points){
  state.progress.current += points;
  if(state.progress.current > state.progress.total){
    state.progress.current = state.progress.total;
  }
}
/*************************************************
 * ACCUEIL
 *************************************************/
render(`
<h1>Activité physique</h1>
<p>Questionnaire destiné à préparer votre consultation médicale.<br>
Aucune donnée n’est enregistrée.</p>

<div class="rgpd">
<a href="https://abbe-web.github.io/Questionnaire-AutoEvaluation-AP/politique-confidentialite.html" target="_blank">
Politique de confidentialité
</a>
</div>

<button class="btn" onclick="start('gpaq')">Questionnaire détaillé (GPAQ)</button>
<button class="btn secondary" onclick="start('marshall')">Questionnaire court (Marshall)</button>
`,0,false);

function start(tool){
  state.tool = tool;
  state.gpaq = {};
  state.marshall = {};
  state.result = {};
  state.history = [];

  state.progress.current = 0;
  state.progress.total = (tool === "marshall") ? 8 : 12;

}

 * GPAQ — INTRODUCTION GÉNÉRALE OMS
 *************************************************/

Pensez tout d’abord au temps que vous y consacrez au travail, qu'il s'agisse d'un travail rémunéré ou non, de tâches ménagères,

function minutes(h,m){ return (Number(h||0)*60)+Number(m||0); }

function finishGPAQ(){
  advanceProgress(1); // sédentarité = 1 point

  const wi = (state.gpaq.wi_d||0)*minutes(state.gpaq.wi_h,state.gpaq.wi_m);
  const wm = (state.gpaq.wm_d||0)*minutes(state.gpaq.wm_h,state.gpaq.wm_m);
  const tr = (state.gpaq.tr_d||0)*minutes(state.gpaq.tr_h,state.gpaq.tr_m);
  const li = (state.gpaq.li_d||0)*minutes(state.gpaq.li_h,state.gpaq.li_m);
  const lm = (state.gpaq.lm_d||0)*minutes(state.gpaq.lm_h,state.gpaq.lm_m);

  const MET = wi*8 + li*8 + (wm+tr+lm)*4;
  state.result.met = MET;

  if(MET>=3000) state.result.niveau="très_actif";
  else if(MET>=600) state.result.niveau="moyennement_actif";
  else state.result.niveau="insuffisamment_actif";

  motivation();
}

/*************************************************
 * MOTIVATION + EVA
 *************************************************/
function motivation(){
  if(state.result.niveau!=="insuffisamment_actif"){
    render(`

    <button class="btn" onclick="advanceProgress(2); state.result.stade='consolidation'; evaImportance()">Oui</button>

function openPrintable(){
  if(!state.exportJSON) return;

  const json = encodeURIComponent(
    JSON.stringify(state.exportJSON)
  );

  window.open(
    "print.html?data=" + json,
    "_blank"
  );
}
function shareToDoctor() {

  if (!state.exportJSON) {
    alert("Données indisponibles.");
    return;
  }

  const mailTitle = "Auto-évaluation de l’activité physique – consultation médicale";

  const dataBlock =
`--- DÉBUT DES DONNÉES ---
${JSON.stringify(state.exportJSON, null, 2)}
--- FIN DES DONNÉES ---`;

  const mailBody =
`Bonjour,

Vous trouverez ci-dessous les informations issues de mon questionnaire
d’auto-évaluation de l’activité physique, rempli en amont de la consultation.

Ces données peuvent être copiées et intégrées dans votre compte-rendu médical.

${dataBlock}`;

  const subject = encodeURIComponent(mailTitle);
  const body = encodeURIComponent(mailBody);

  /* 📱 Mobile → partage natif */
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if (isMobile && navigator.share) {
    navigator.share({
      title: mailTitle,
      text: mailTitle + "\n\n" + mailBody
    }).catch(() => {
      copyFallback(mailTitle + "\n\n" + mailBody);
    });
    return;
  }

  /* 🖥️ PC → client mail par défaut (Outlook / Exchange) */
  window.location.href = `mailto:?subject=${subject}&body=${body}`;

  /* 📋 Fallback copie */
  copyFallback(mailTitle + "\n\n" + mailBody);
}
