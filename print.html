<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résumé de la pré-consultation d'activité physique</title>

<style>

@page {
  size: A4;
  margin: 20mm;
}

@media print {
  body {
    margin: 0;
  }
}
  
  body {
  font-family: Arial, sans-serif;
  margin: 30px;
  color: #000;
  font-size: 14px;
}

h1 {
  font-size: 20px;
  margin-bottom: 4px;
}

h2 {
  font-size: 16px;
  margin-top: 22px;
  padding-bottom: 3px;
}

h3 {
  font-size: 14px;
  margin-top: 14px;
}

p {
  margin: 4px 0;
}
  
.synthese-line {
  margin: 6px 0;
}
.section {
  margin-top: 15px;
}

.small {
  font-size: 12px;
  color: #555;
}

.block {
  margin-left: 15px;
}

.verbatim {
  font-style: italic;
  margin-left: 15px;
   font-size: 12px;
  color: #555;
}

@media print {
  body {
    margin: 20mm;
  }
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  margin-bottom: 15px;
}

th, td {
  border: 1px solid #ccc;
  padding: 4px 6px;
  font-size: 12px;
  vertical-align: top;
}

th {
  background: #f2f2f2;
  font-weight: bold;
}


@media print {
  .actions {
    display: none;
  }
}
@media print {

  h2 {
    page-break-after: avoid;
    break-after: avoid;
  }

  table {
    page-break-inside: avoid;
    break-inside: avoid;
  }
}
/* === Tableaux GPAQ : colonnes strictement identiques === */
table {
  table-layout: fixed;
  width: 100%;
}

/* 3 colonnes = 1/3 chacune */
table th,
table td {
  width: 33.33%;
  text-align: center;
  vertical-align: middle;
  line-height: 1.3;
  white-space: nowrap;
}

/* Première colonne (texte) alignée à gauche */
table th:first-child,
table td:first-child {
  text-align: left;
}

/* En-têtes discrets */
table th {
  background: #f3f3f3;
  font-weight: 600;
}

/* Alignement vertical homogène */
table th,
table td {
  vertical-align: middle;
  line-height: 1.3;
}

/* En-têtes plus discrets */
table th {
  background: #f3f3f3;
  font-weight: 600;
}
/* Bloc actions : vertical */
.actions {
  margin-top: 30px;
  text-align: center;
}

/* Boutons sur une même ligne */
.actions-buttons {
  display: inline-flex;        /* clé : inline-flex */
  gap: 12px;
}

/* Boutons harmonisés */
.actions-buttons button {
  width: 220px;                /* plus fin, passe partout */
  padding: 10px 14px;
  font-size: 14px;
  border: 1px solid #999;
  background: #f5f5f5;
  cursor: pointer;
}

.actions-buttons button:hover {
  background: #eaeaea;
}

/* Texte TOUJOURS en dessous */
.actions-note {
  margin-top: 10px;
  font-size: 11px;
  color: #777;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

/* Impression : masqué */
@media print {
  .actions {
    display: none;
  }
}

/* Correctif iOS / écrans étroits : éviter chevauchement dans tableaux */
@media screen and (max-width: 600px) {

  table {
    table-layout: fixed;
  }

  th, td {
    word-wrap: break-word;
    overflow-wrap: break-word;
  }

  /* Colonne "Intensité / Type" autorise le retour à la ligne */
  td:first-child {
    white-space: normal;
  }
}
/* Correctif iOS / mobile pour les boutons d’actions */
@media screen and (max-width: 600px) {

  .actions {
    margin-top: 40px; /* descend légèrement le bloc */
  }

  .actions-buttons {
    flex-wrap: wrap;           /* autorise retour à la ligne si besoin */
    gap: 10px;
  }

  .actions-buttons button {
    width: 100%;               /* boutons pleine largeur sur mobile */
    max-width: 320px;          /* mais pas trop larges */
    font-size: 14px;
  }

  .actions-note {
    margin-top: 12px;          /* espace clair sous les boutons */
    text-align: center;        /* centré (plus joli sur mobile) */
  }
}
/* Correctif impression iOS : forcer 1 page A4 */
@media print and (max-width: 600px) {

  body {
    font-size: 13px;          /* très léger */
    line-height: 1.25;
    margin: 18mm;             /* réduit légèrement vs PC */
  }

  h1 {
    font-size: 18px;
    margin-bottom: 3px;
  }

  h2 {
    margin-top: 16px;
  }

  h3 {
    margin-top: 10px;
  }

  table {
    margin-bottom: 10px;
  }

  p {
    margin: 3px 0;
  }
}
/* === Correctif final iOS : marges latérales trop grandes à l’impression === */
@media print and (max-width: 600px) {

  @page {
    size: A4;
    margin: 12mm;              /* clé : réduire les marges */
  }

  html, body {
    width: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-size: 13px;
    line-height: 1.25;
    padding: 12mm;             /* contrôle réel des marges */
    box-sizing: border-box;
  }

  /* Tables : éviter qu’elles élargissent la page */
  table {
    width: 100%;
    max-width: 100%;
  }
}
/* Bouton retour depuis la version imprimable */
.nav-back {
  margin-bottom: 15px;
}

.nav-back button {
  background: none;
  border: none;
  color: #007BFF;
  font-size: 14px;
  padding: 6px 0;
  cursor: pointer;
}

/* Jamais affiché à l’impression */
@media print {
  .nav-back {
    display: none;
  }
}

</style>
</head>

<body>
  
<div class="nav-back">
    <button onclick="goBack()">← Retour au questionnaire</button>
  </div>
  
<h1>Résumé d'évaluation pré-consultation d'activité physique</h1>

<p id="questionnaire-type" class="small"></p>

<p class="small">
Questionnaire d’auto-évaluation rempli par le patient – à discuter avec le médecin<br>
Date : <span id="date"></span>
</p>

<div id="content"></div>

<script>
function goBack() {
  window.location.href = "index.html";
}
  
function getJSONFromURL(){
  const params = new URLSearchParams(window.location.search);
  const data = params.get("data");
  if (!data) return null;

  try {
    return JSON.parse(decodeURIComponent(data));
  } catch (e) {
    console.warn("Données URL invalides", e);
    return null;
  }
}


const data = getJSONFromURL();
document.getElementById("date").innerText = new Date().toLocaleDateString();
const typeEl = document.getElementById("questionnaire-type");
if (typeEl && data?.meta?.questionnaires) {
  typeEl.innerText = "Questionnaire rempli : " + data.meta.questionnaires;
}

if(!data){
  document.getElementById("content").innerHTML =
    "<p>Données indisponibles.</p>";
} else {

  document.getElementById("content").innerHTML = `

<h2>1. Synthèse</h2>

<p class="synthese-line">
  <strong>Niveau d’activité physique :</strong>
  ${data.resultats.niveau_activite.replace("_"," ")}
  <span class="small">
    (volume estimé : ${data.resultats.met_minutes_semaine} MET-min / semaine)
  </span>
</p>

<p class="synthese-line">
  <strong>Stade motivationnel :</strong>
  ${data.motivation.stade}
</p>

<p class="synthese-line">
  <strong>Importance de l’activité physique :</strong>
  ${data.motivation.importance_eva_0_10}/10
</p>

${data.motivation.importance_commentaire
  ? `<p class="verbatim small">“${data.motivation.importance_commentaire}”</p>`
  : ""
}

<p class="synthese-line">
  <strong>Confiance en soi pour augmenter / maintenir son niveau d’activité :</strong>
  ${data.motivation.confiance_eva_0_10}/10
</p>

${data.motivation.confiance_commentaire
  ? `<p class="verbatim small">“${data.motivation.confiance_commentaire}”</p>`
  : ""
}


<div id="gpaq-section">
 <h2 id="gpaq-title">Questionnaire GPAQ – Détail</h2>

 <h3>Travail</h3>

<table>
  <tr>
    <th>Intensité</th>
    <th>Fréquence</th>
    <th>Durée par jour</th>
  </tr>

  <tr>
    <td>Intense</td>
    <td>
      ${data.questionnaires.gpaq.travail.intense.jours_par_semaine ?? 0} jours / semaine
    </td>
    <td>
      ${(data.questionnaires.gpaq.travail.intense.heures_par_jour || 0)} h
      ${(data.questionnaires.gpaq.travail.intense.minutes_par_jour || 0)} min
    </td>
  </tr>

  <tr>
    <td>Modérée</td>
    <td>
      ${data.questionnaires.gpaq.travail.moderee.jours_par_semaine ?? 0} jours / semaine
    </td>
    <td>
      ${(data.questionnaires.gpaq.travail.moderee.heures_par_jour || 0)} h
      ${(data.questionnaires.gpaq.travail.moderee.minutes_par_jour || 0)} min
    </td>
  </tr>
</table>

  <h3>Déplacements</h3>

<table>
  <tr>
    <th>Type</th>
    <th>Fréquence</th>
    <th>Durée par jour</th>
  </tr>

  <tr>
    <td>Marche / vélo ≥ 10 min</td>
    <td>
      ${data.questionnaires.gpaq.deplacements.jours_par_semaine ?? 0} jours / semaine
    </td>
    <td>
      ${(data.questionnaires.gpaq.deplacements.heures_par_jour || 0)} h
      ${(data.questionnaires.gpaq.deplacements.minutes_par_jour || 0)} min
    </td>
  </tr>
</table>

 <h3>Loisirs</h3>

<table>
  <tr>
    <th>Intensité</th>
    <th>Fréquence</th>
    <th>Durée par jour</th>
  </tr>

  <tr>
    <td>Intense</td>
    <td>
      ${data.questionnaires.gpaq.loisirs.intense.jours_par_semaine ?? 0} jours / semaine
    </td>
    <td>
      ${(data.questionnaires.gpaq.loisirs.intense.heures_par_jour || 0)} h
      ${(data.questionnaires.gpaq.loisirs.intense.minutes_par_jour || 0)} min
    </td>
  </tr>

  <tr>
    <td>Modérée</td>
    <td>
      ${data.questionnaires.gpaq.loisirs.moderee.jours_par_semaine ?? 0} jours / semaine
    </td>
    <td>
      ${(data.questionnaires.gpaq.loisirs.moderee.heures_par_jour || 0)} h
      ${(data.questionnaires.gpaq.loisirs.moderee.minutes_par_jour || 0)} min
    </td>
  </tr>
</table>

  <h3>Comportement sédentaire</h3>

<table>
  <tr>
    <th>Temps assis / couché (hors sommeil)</th>
  </tr>
  <tr>
    <td>
      ${(data.questionnaires.gpaq.sedentarite.heures_par_jour || 0)} h
      ${(data.questionnaires.gpaq.sedentarite.minutes_par_jour || 0)} min / jour
    </td>
  </tr>
</table>

</div>

<div id="marshall-section">
  <h2 id="marshall-title">2. Questionnaire Marshall</h2>
  <p>Score : ${ (data.questionnaires.marshall.q1 || 0) + (data.questionnaires.marshall.q2 || 0) }</p>

  <p class="small" style="margin-top:40px;">
  Ce document est destiné à être discuté avec votre médecin.
  </p>
  </div>

 <div class="actions">
  <div class="actions-buttons">
    <button onclick="window.print()">Imprimer / Enregistrer en PDF</button>
    <button onclick="copyContent()">Copier le contenu</button>
  </div>

  <p class="small actions-note">
    Ces actions n’altèrent pas vos réponses.<br>
    Le document peut être imprimé, enregistré en PDF ou copié pour un usage médical.
  </p>
</div>

</div>

  `;
  if (data.meta.questionnaires === "GPAQ") {
  const gpaqTitle = document.getElementById("gpaq-title");
  if (gpaqTitle) {
    gpaqTitle.innerText = "2. Questionnaire GPAQ – Détail";
  }
}

if (data.meta.questionnaires === "Marshall") {
  const marshallTitle = document.getElementById("marshall-title");
  if (marshallTitle) {
    marshallTitle.innerText = "2. Questionnaire Marshall";
  }
}
  if (data.meta.questionnaires === "Marshall") {
  const gpaq = document.getElementById("gpaq-section");
  if (gpaq) gpaq.style.display = "none";
}

if (data.meta.questionnaires === "GPAQ") {
  const marshall = document.getElementById("marshall-section");
  if (marshall) marshall.style.display = "none";
}
function copyContent(){
  const text = document.getElementById("content").innerText;

navigator.clipboard.writeText(text)
  .then(() => console.log("Contenu copié"))
  .catch(() => console.warn("Copie impossible"));
}

}
</script>

</body>
</html>
